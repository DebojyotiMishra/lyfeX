# macOS has no native Vulkan; Homebrew installs the Vulkan loader (and MoltenVK)
# outside the default dynamic linker search path. `DYLD_LIBRARY_PATH` doesn't
# reliably help here: macOS SIP strips `DYLD_*` env vars when exec'ing
# SIP-restricted binaries (which `cargo` itself often is), so the variable
# frequently never reaches spawned processes — e.g. `cargo test`'s test
# binaries. Baking an rpath into the binary at link time isn't affected by
# that, since it's embedded in the Mach-O file rather than passed via env.
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-rpath,/opt/homebrew/lib"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-rpath,/usr/local/lib"]
